# Example robot configuration file: calibration/templates/active.example.properties
#
# Real files live on the robot controller in /sdcard/FIRST/overdrive/ (active.properties, candidate.properties, history/...)
# and are created ONLY by the calibration OpModes ("CAL Config Manager" -> accept) or scripts/config.sh ... accept.
# Do not hand-write an active.properties unless you know what you are doing: use the tools, which validate everything.
#
# Format: sparse overrides of the compiled defaults, one "p.<parameter key>=<value>" per line. A key that is ABSENT is
# unchanged (and, for hardware values, still counts as an uncalibrated placeholder). Keys and ranges: docs/PARAMETERS.md.
#
# This template deliberately contains no overrides: copying it changes nothing.
