apply plugin: 'com.android.application'

//
// build.gradle in TeamCode
//
// Most of the definitions for building your module reside in a common, shared
// file 'build.common.gradle'. Being factored in this way makes it easier to
// integrate updates to the FTC into your code. If you really need to customize
// the build definitions, you can place those customizations in this file, but
// please think carefully as to whether such customizations are really necessary
// before doing so.

// Custom definitions may go here

// Hardware-independent tests (real Ivy scheduler, mocked hardware). JUnit is not in the offline Gradle cache, so the
// suites run through a small runner; this task just wraps scripts/run_tests.sh so it is available from Android Studio:
//   ./gradlew :TeamCode:hostTests                       (all suites)
//   ./gradlew :TeamCode:hostTests -Psuites="turret ivy"  (selected suites; see scripts/run_tests.sh --list)
tasks.register('hostTests', Exec) {
    group = 'verification'
    description = 'Runs the hardware-independent test suites (simulation only)'
    workingDir = rootProject.projectDir
    def suites = project.hasProperty('suites') ? project.property('suites').toString().split(' ').toList() : []
    commandLine(['bash', 'scripts/run_tests.sh'] + suites)
}

// Include common definitions from above.
apply from: '../build.common.gradle'
apply from: '../build.dependencies.gradle'

android {
    namespace = 'org.firstinspires.ftc.teamcode'

    packagingOptions {
        jniLibs.useLegacyPackaging true
    }
}

dependencies {
    implementation project(':FtcRobotController')
}
